<!-- Ghost Writer's live speech pill. Needs /assets/media/pill.css in <head> and /assets/media/pill.js (defer) once per page.
     pill.js replaces the picture inside with the live pill; without JavaScript the app's own still pill shows. -->
<div class="gw-pill" data-gw-pill>
  <img class="gw-pill-static dark-only" src="/assets/media/pill-dark.webp" width="492" height="152" alt="Ghost Writer's listening pill: a wavy line that moves with your voice" loading="lazy" decoding="async">
  <img class="gw-pill-static light-only" src="/assets/media/pill-light.webp" width="492" height="152" alt="" loading="lazy" decoding="async">
</div>
