<!doctype html>
<!--
  Ghost Writer boot splash: the logo reveal the app plays while it pre-renders its pages (6.8).
  Style after the owner's reference reel (francois_dvr, 2026-10): the mark's outline draws on, an
  oversized blurred body sweeps in and shrinks into it, the eyes light with a bloom, the name slides
  out letter by letter, the lockup settles and holds. The final frame is the app's own logo
  (assets/ghost-*-{halo,body,eyes}.png come from ui_art, see dev/design/boot-splash/README.md).
-->
<html
  lang="en"
  data-composition-variables='[
    { "id": "bg", "type": "color", "label": "Background", "default": "#0f1116" },
    { "id": "accent", "type": "color", "label": "Indigo", "default": "#8f91ff" },
    { "id": "halo_src", "type": "string", "label": "Halo picture", "default": "assets/ghost-dark-halo.png" },
    { "id": "body_src", "type": "string", "label": "Body picture", "default": "assets/ghost-dark-body.png" },
    { "id": "eyes_src", "type": "string", "label": "Eyes picture", "default": "assets/ghost-dark-eyes.png" }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=480, height=480" />
    <script src="/assets/vendor/gsap/gsap.min.js"></script>
    <script src="/assets/vendor/gsap/MotionPathPlugin.min.js"></script>
    <style>
      @font-face {
        font-family: "Grenze Gotisch";
        src: url("/assets/fonts/GrenzeGotisch-ExtraBold.ttf") format("truetype");
        font-weight: 800;
        font-style: normal;
      }
      :root {
        --bg: #0f1116;
        --accent: #8f91ff;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 480px;
        height: 480px;
        overflow: hidden;
        background: var(--bg);
      }
      #root {
        position: relative;
        width: 480px;
        height: 480px;
        overflow: hidden;
      }
      #ground {
        position: absolute;
        inset: 0;
        background: var(--bg);
      }
      #lockup {
        position: absolute;
        inset: 0;
      }
      #stage {
        position: absolute;
        inset: 0;
        will-change: transform;
      }
      /* The ghost's body box: 574 x 800 drawn at 0.275 = 157.85 x 220, centred on (240, 196). */
      #ghost {
        position: absolute;
        left: 161.075px;
        top: 86px;
        width: 157.85px;
        height: 220px;
        will-change: transform, filter, opacity;
      }
      #ghost img {
        position: absolute;
        display: block;
      }
      #halo {
        left: -26.4px;
        top: -26.4px;
        width: 210.65px;
        height: 272.8px;
        opacity: 0;
      }
      #body,
      #eyes {
        left: 0;
        top: 0;
        width: 157.85px;
        height: 220px;
      }
      #eyes {
        opacity: 0;
      }
      #flash {
        position: absolute;
        left: 23px;
        top: 20px;
        width: 112px;
        height: 76px;
        border-radius: 50%;
        background: radial-gradient(closest-side, #ffffff 0%, var(--accent) 30%, transparent 72%);
        mix-blend-mode: screen;
        opacity: 0;
        will-change: transform, opacity;
      }
      #trace {
        position: absolute;
        left: 161.075px;
        top: 86px;
        width: 157.85px;
        height: 220px;
        overflow: visible;
      }
      .trace-line,
      .trace-glow {
        fill: none;
        stroke: var(--accent);
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .trace-line {
        stroke-width: 9;
      }
      .trace-glow {
        stroke-width: 26;
        opacity: 0.35;
        filter: blur(6px);
      }
      .tip {
        opacity: 0;
      }
      #name {
        position: absolute;
        left: 0;
        width: 480px;
        top: 336px;
        text-align: center;
        white-space: nowrap;
        font-family: "Grenze Gotisch", serif;
        font-weight: 800;
        font-size: 46px;
        line-height: 1.1;
        color: var(--accent);
      }
      .l {
        display: inline-block;
        will-change: transform, opacity, filter;
      }
      .gap {
        width: 0.26em;
      }
    
      html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }
      #ground { display: none; }
      #root { position: absolute; overflow: visible; }
    </style>

    <script>
      (function () {
        "use strict";
        gsap.registerPlugin(MotionPathPlugin);
        var vars = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {};
        if (vars.bg) document.documentElement.style.setProperty("--bg", vars.bg);
        if (vars.accent) document.documentElement.style.setProperty("--accent", vars.accent);

        var right = document.getElementById("line-right");
        var left = document.getElementById("line-left");
        var strokes = [right, left, document.getElementById("glow-right"), document.getElementById("glow-left")];
        strokes.forEach(function (p) {
          var len = p.getTotalLength();
          p.style.strokeDasharray = len + " " + len;
          p.style.strokeDashoffset = String(len);
        });

        var tl = gsap.timeline({ paused: true });
        gsap.set("#stage", { transformOrigin: "50% 50%" });
        gsap.set("#ghost", { transformOrigin: "50% 50%" });
        gsap.set("#flash", { transformOrigin: "50% 50%" });

        // 1. The outline draws on from the top of the head, down both sides, two lit tips leading.
        var TRACE = 0.85;
        tl.to(strokes, { strokeDashoffset: 0, duration: TRACE, ease: "power2.inOut" }, 0.02);
        tl.to("#tip-right", { motionPath: { path: right, align: right, alignOrigin: [0.5, 0.5] }, duration: TRACE, ease: "power2.inOut" }, 0.02);
        tl.to("#tip-left", { motionPath: { path: left, align: left, alignOrigin: [0.5, 0.5] }, duration: TRACE, ease: "power2.inOut" }, 0.02);
        tl.to(".tip", { opacity: 1, duration: 0.1, ease: "power2.out" }, 0.02);
        tl.to(".tip", { opacity: 0, duration: 0.12, ease: "power2.in" }, 0.02 + TRACE - 0.04);

        // 2. The sweep: the body arrives huge and blurred from the top left and shrinks into the outline.
        tl.fromTo(
          "#ghost",
          { scale: 4.2, x: -230, y: -300, rotation: -12, opacity: 0 },
          { scale: 1, x: 0, y: 0, rotation: 0, opacity: 1, duration: 0.7, ease: "power3.out" },
          0.72
        );
        tl.fromTo("#ghost", { filter: "blur(22px)" }, { filter: "blur(0px)", duration: 0.75, ease: "power3.out" }, 0.72);

        // 3. The eyes light with a flash, the outline gives way to the body's own rim, the glow blooms.
        tl.to("#eyes", { opacity: 1, duration: 0.12, ease: "power4.out" }, 1.38);
        tl.fromTo("#flash", { opacity: 0, scale: 0.5 }, { opacity: 0.9, scale: 1, duration: 0.08, ease: "power2.out" }, 1.38);
        tl.to("#flash", { opacity: 0, scale: 1.9, duration: 0.42, ease: "power3.out" }, 1.46);
        tl.to(".trace-line, .trace-glow", { opacity: 0, duration: 0.25, ease: "power2.out" }, 1.4);
        tl.to("#halo", { opacity: 1, duration: 0.5, ease: "power2.out" }, 1.42);

        // 4. The name slides out from the middle, letter by letter, the spacing tightening as it lands.
        tl.fromTo(
          ".l",
          { opacity: 0, x: function (i) { return (i - 5.5) * 16; }, filter: "blur(6px)" },
          { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.6, ease: "expo.out", stagger: { each: 0.035, from: "center" } },
          1.55
        );

        // 5. The lockup settles to its final size and holds; the last frame is the app's own logo.
        tl.fromTo("#stage", { scale: 1.06 }, { scale: 1, duration: 0.45, ease: "power2.inOut" }, 2.4);

        window.__timelines["main"] = tl;
        tl.seek(0);
      })();
    </script>
